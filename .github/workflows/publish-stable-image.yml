name: Publish Studio Stable Image

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    IMAGE_NAME: cloudseidoranalytics/daianastudio

on:
    workflow_dispatch:
        inputs:
            source_sha:
                description: 'Optional exact 40-character commit SHA from production'
                required: false
                type: string
            repair:
                description: 'Allow replacement of an existing stable tag'
                required: false
                default: false
                type: boolean
            repair_confirmation:
                description: 'Required only for repair: OVERWRITE vX.Y.Z'
                required: false
                type: string

permissions:
    contents: read

concurrency:
    group: studio-stable-publication
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        outputs:
            digest: ${{ steps.verify.outputs.digest }}
            reference: ${{ steps.verify.outputs.reference }}
            source_commit: ${{ steps.source.outputs.sha }}
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Checkout production ref
              uses: actions/checkout@v6.0.2
              with:
                  ref: production
                  fetch-depth: 0
                  persist-credentials: false

            - name: Resolve and validate production source
              id: source
              env:
                  INPUT_SHA: ${{ inputs.source_sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  git fetch --no-tags --force origin '+refs/heads/production:refs/remotes/origin/production'
                  production_sha="$(git rev-parse 'origin/production^{commit}')"
                  if [[ -n "$INPUT_SHA" ]]; then
                    [[ "$INPUT_SHA" =~ ^[A-Fa-f0-9]{40}$ ]] || { echo "Source SHA must contain exactly 40 hexadecimal characters"; exit 1; }
                    source_sha="$(printf '%s' "$INPUT_SHA" | tr '[:upper:]' '[:lower:]')"
                  else
                    source_sha="$production_sha"
                  fi
                  git cat-file -e "$source_sha^{commit}" 2>/dev/null || { echo "Source SHA is not a commit in this repository"; exit 1; }
                  resolved_sha="$(git rev-parse "$source_sha^{commit}")"
                  [[ "$resolved_sha" == "$source_sha" ]] || { echo "Source SHA did not resolve exactly"; exit 1; }
                  git merge-base --is-ancestor "$resolved_sha" "$production_sha" || { echo "Source SHA is not an ancestor of origin/production"; exit 1; }
                  echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"

            - name: Checkout exact production source
              uses: actions/checkout@v6.0.2
              with:
                  ref: ${{ steps.source.outputs.sha }}
                  fetch-depth: 1
                  persist-credentials: false

            - name: Read and validate release version
              id: version
              shell: bash
              run: |
                  set -euo pipefail
                  version="$(jq -r '.version // empty' package.json)"
                  [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
                    echo "Root package.json version must be stable X.Y.Z; got: $version"
                    exit 1
                  }
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "tag=v$version" >> "$GITHUB_OUTPUT"

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.0.0

            - name: Guard stable tag
              env:
                  IMAGE: ${{ env.IMAGE_NAME }}
                  TAG: ${{ steps.version.outputs.tag }}
                  REPAIR: ${{ inputs.repair }}
                  CONFIRMATION: ${{ inputs.repair_confirmation }}
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ "$REPAIR" == 'true' && "$CONFIRMATION" != "OVERWRITE $TAG" ]]; then
                    echo "Repair requires exact confirmation: OVERWRITE $TAG"
                    exit 1
                  fi
                  inspect_output=""
                  if inspect_output="$(docker buildx imagetools inspect "$IMAGE:$TAG" 2>&1)"; then
                    old_digest="$(printf '%s\n' "$inspect_output" | awk '/^Digest:/ { print $2; exit }')"
                    [[ "$old_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unable to capture the existing stable image digest"; exit 1; }
                    if [[ "$REPAIR" != 'true' ]]; then
                      echo "Stable tag already exists; refusing to overwrite it: $IMAGE:$TAG"
                      exit 1
                    fi
                    echo "Preserving existing stable digest: $old_digest"
                    echo "old_digest=$old_digest" >> "$GITHUB_ENV"
                  elif ! printf '%s' "$inspect_output" | grep -Eiq 'not found|no such manifest|manifest unknown|404'; then
                    echo "Unable to prove stable tag is unused: $IMAGE:$TAG"
                    printf '%s\n' "$inspect_output"
                    exit 1
                  fi

            - name: Build and publish stable multi-arch image
              id: build
              uses: docker/build-push-action@v6.19.2
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
                      org.opencontainers.image.version=${{ steps.version.outputs.version }}
                  annotations: |
                      index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      index:org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
                      index:org.opencontainers.image.version=${{ steps.version.outputs.version }}
                  provenance: mode=max
                  sbom: true

            - name: Verify and report stable manifest
              id: verify
              env:
                  IMAGE: ${{ env.IMAGE_NAME }}
                  TAG: ${{ steps.version.outputs.tag }}
                  VERSION: ${{ steps.version.outputs.version }}
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
                  DIGEST: ${{ steps.build.outputs.digest }}
              shell: bash
              run: |
                  set -euo pipefail
                  [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Build returned an invalid OCI index digest"; exit 1; }
                  raw="$RUNNER_TEMP/stable-index.json"
                  docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > "$raw"
                  [[ "sha256:$(sha256sum "$raw" | cut -d ' ' -f 1)" == "$DIGEST" ]] || { echo "Registry content does not match the build digest"; exit 1; }
                  jq -e --arg source "https://github.com/$GITHUB_REPOSITORY" --arg revision "$SOURCE_SHA" --arg version "$VERSION" \
                    '.annotations["org.opencontainers.image.source"] == $source and .annotations["org.opencontainers.image.revision"] == $revision and .annotations["org.opencontainers.image.version"] == $version and
                     (any(.manifests[].platform; .os == "linux" and .architecture == "amd64")) and (any(.manifests[].platform; .os == "linux" and .architecture == "arm64"))' "$raw" >/dev/null
                  reference="$IMAGE@$DIGEST"
                  echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
                  echo "reference=$reference" >> "$GITHUB_OUTPUT"
                  {
                    echo "## Studio stable image"
                    echo
                    echo "- Image reference: \`$reference\`"
                    echo "- Stable tag: \`$IMAGE:$TAG\`"
                    echo "- Source commit: \`$SOURCE_SHA\`"
                    echo "- Version: \`$VERSION\`"
                    echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
                    if [[ -n "${old_digest:-}" ]]; then
                      echo "- Replaced digest: \`$old_digest\`"
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"
